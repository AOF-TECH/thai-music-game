<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สัมผัสเสียง ดนตรีไทยสดใส - บทเพลงยาวสำหรับเด็ก</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font Cute & Friendly -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- MediaPipe Hand Landmarker Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0"></script>
  
  <style>
    body {
      font-family: 'Mali', cursive, sans-serif;
    }

    @keyframes floatNote {
      0% { transform: translateY(0px) scale(0.8) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-80px) scale(1.4) rotate(25deg); opacity: 0; }
    }

    .animate-float-note {
      animation: floatNote 0.9s ease-out forwards;
    }

    .instrument-card {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .instrument-card.active {
      transform: translateY(-12px) scale(1.08);
      box-shadow: 0 18px 35px rgba(255, 180, 0, 0.45);
    }

    .note-particle {
      position: absolute;
      pointer-events: none;
      font-size: 2.2rem;
      z-index: 50;
    }

    /* สไตล์สำหรับรูปเครื่องดนตรีจริง */
    .inst-img {
      object-fit: contain;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.15));
      transition: transform 0.2s ease;
    }
    
    .instrument-card:hover .inst-img {
      transform: scale(1.1);
    }
  </style>
</head>

<body class="bg-gradient-to-b from-sky-200 via-indigo-100 to-amber-100 text-slate-800 min-h-screen flex flex-col justify-between p-3 md:p-5 select-none overflow-hidden">

  <!-- Header -->
  <header class="flex justify-between items-center bg-white/80 backdrop-blur-md p-3 md:p-4 rounded-3xl border-4 border-amber-300 shadow-lg">
    <div class="flex items-center gap-3">
      <div class="bg-amber-400 text-3xl p-2.5 rounded-2xl shadow-inner animate-bounce">
        🎵
      </div>
      <div>
        <h1 class="text-xl md:text-3xl font-bold text-amber-600 drop-shadow-sm">
          ✨ สัมผัสเสียง บทเพลงไทย ✨
        </h1>
        <p class="text-xs md:text-base text-slate-600 font-semibold">
          วางมือค้างไว้ที่รูปเครื่องดนตรี เพื่อฟังบทเพลงบรรเลงยาว! 🎉
        </p>
      </div>
    </div>
    
    <div id="status" class="text-xs md:text-sm font-bold bg-amber-100 text-amber-700 px-4 py-2 rounded-2xl border-2 border-amber-300 shadow-sm flex items-center gap-2">
      <span>⏳ กำลังเตรียมกล้อง...</span>
    </div>
  </header>

  <!-- Video Preview Area -->
  <main class="relative flex-1 my-3 bg-white/60 rounded-3xl border-4 border-sky-300/80 shadow-xl overflow-hidden flex items-center justify-center">
    <video id="webcam" class="absolute inset-0 w-full h-full object-cover -scale-x-100" autoplay playsinline></video>
    <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover -scale-x-100 pointer-events-none"></canvas>

    <!-- Visual Banner Guides -->
    <div class="absolute top-3 bg-amber-400/90 text-slate-900 px-6 py-2 rounded-full border-2 border-white text-xs md:text-base font-bold shadow-lg backdrop-blur-sm flex items-center gap-2 animate-pulse">
      <span>👇 วางมือค้างไว้ที่เครื่องดนตรีด้านล่าง 🎼</span>
    </div>

    <!-- Floating Notes Effect Layer -->
    <div id="particle-layer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
  </main>

  <!-- Instrument Cards ( Real Image Version ) -->
  <footer class="grid grid-cols-5 gap-2 md:gap-4 h-36 md:h-44">
    
    <!-- 1. ระนาดเอก -->
    <div id="inst-ranat" class="instrument-card bg-amber-100 border-4 border-amber-400 rounded-3xl p-2 md:p-3 flex flex-col items-center justify-between text-center shadow-md relative overflow-hidden">
      <div class="w-full h-16 md:h-24 flex items-center justify-center">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Ranat_ek.png/640px-Ranat_ek.png" alt="ระนาดเอก" class="inst-img max-h-full">
      </div>
      <div>
        <div class="font-bold text-amber-800 text-xs md:text-lg">ระนาดเอก</div>
        <div class="text-[10px] md:text-xs text-amber-600 font-semibold bg-amber-200 px-2 py-0.5 rounded-full">เพลงระนาดรัว 🎶</div>
      </div>
    </div>

    <!-- 2. ฆ้องวงใหญ่ -->
    <div id="inst-khong" class="instrument-card bg-rose-100 border-4 border-rose-400 rounded-3xl p-2 md:p-3 flex flex-col items-center justify-between text-center shadow-md relative overflow-hidden">
      <div class="w-full h-16 md:h-24 flex items-center justify-center">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Khong_wong_yai.png/640px-Khong_wong_yai.png" alt="ฆ้องวงใหญ่" class="inst-img max-h-full">
      </div>
      <div>
        <div class="font-bold text-rose-800 text-xs md:text-lg">ฆ้องวง</div>
        <div class="text-[10px] md:text-xs text-rose-600 font-semibold bg-rose-200 px-2 py-0.5 rounded-full">ทำนองไทยเดิม 🔔</div>
      </div>
    </div>

    <!-- 3. ตะโพน -->
    <div id="inst-taphon" class="instrument-card bg-emerald-100 border-4 border-emerald-400 rounded-3xl p-2 md:p-3 flex flex-col items-center justify-between text-center shadow-md relative overflow-hidden">
      <div class="w-full h-16 md:h-24 flex items-center justify-center">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Taphon.png/640px-Taphon.png" alt="ตะโพน" class="inst-img max-h-full">
      </div>
      <div>
        <div class="font-bold text-emerald-800 text-xs md:text-lg">ตะโพน</div>
        <div class="text-[10px] md:text-xs text-emerald-600 font-semibold bg-emerald-200 px-2 py-0.5 rounded-full">หน้าทับกลอง 💥</div>
      </div>
    </div>

    <!-- 4. ฉิ่ง -->
    <div id="inst-ching" class="instrument-card bg-sky-100 border-4 border-sky-400 rounded-3xl p-2 md:p-3 flex flex-col items-center justify-between text-center shadow-md relative overflow-hidden">
      <div class="w-full h-16 md:h-24 flex items-center justify-center">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Ching_instrument.png/640px-Ching_instrument.png" alt="ฉิ่ง" class="inst-img max-h-full">
      </div>
      <div>
        <div class="font-bold text-sky-800 text-xs md:text-lg">ฉิ่ง</div>
        <div class="text-[10px] md:text-xs text-sky-600 font-semibold bg-sky-200 px-2 py-0.5 rounded-full">คุมจังหวะ 🎵</div>
      </div>
    </div>

    <!-- 5. ซออู้ -->
    <div id="inst-saw" class="instrument-card bg-purple-100 border-4 border-purple-400 rounded-3xl p-2 md:p-3 flex flex-col items-center justify-between text-center shadow-md relative overflow-hidden">
      <div class="w-full h-16 md:h-24 flex items-center justify-center">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Saw_u.png/640px-Saw_u.png" alt="ซออู้" class="inst-img max-h-full">
      </div>
      <div>
        <div class="font-bold text-purple-800 text-xs md:text-lg">ซออู้</div>
        <div class="text-[10px] md:text-xs text-purple-600 font-semibold bg-purple-200 px-2 py-0.5 rounded-full">ลาวดวงเดือน 🎶</div>
      </div>
    </div>

  </footer>

  <script type="module">
    import { HandLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

    const video = document.getElementById("webcam");
    const canvasElement = document.getElementById("output_canvas");
    const canvasCtx = canvasElement.getContext("2d");
    const statusDiv = document.getElementById("status");
    const particleLayer = document.getElementById("particle-layer");

    let handLandmarker;
    let lastVideoTime = -1;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const N = {
      C4: 261.63, D4: 293.66, E4: 329.63, G4: 392.00, A4: 440.00,
      C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880.00,
      C6: 1046.50, D6: 1174.66, E6: 1318.51
    };

    const instruments = [
      { 
        id: "inst-ranat",  name: "ระนาดเอก", xMin: 0.00, xMax: 0.20, emoji: "🎶", speed: 150,
        melody: [N.C5, N.D5, N.E5, N.G5, N.A5, N.G5, N.E5, N.D5, N.C5, N.E5, N.G5, N.A5, N.C6, N.A5, N.G5, N.E5, N.D5, N.C5, N.D5, N.E5, N.G5, N.E5, N.D5, N.C5]
      },
      { 
        id: "inst-khong",  name: "ฆ้องวง",   xMin: 0.20, xMax: 0.40, emoji: "🔔", speed: 280,
        melody: [N.G4, N.A4, N.C5, N.D5, N.E5, N.G5, N.E5, N.D5, N.C5, N.A4, N.G4, N.A4, N.C5, N.D5, N.C5, N.A4]
      },
      { 
        id: "inst-taphon", name: "ตะโพน",   xMin: 0.40, xMax: 0.60, emoji: "💥", speed: 220,
        melody: [160, 120, 180, 100, 160, 0, 140, 110, 180, 100]
      },
      { 
        id: "inst-ching",  name: "ฉิ่ง",     xMin: 0.60, xMax: 0.80, emoji: "✨", speed: 450,
        melody: [1, 0, 2, 0, 1, 0, 2, 0]
      },
      { 
        id: "inst-saw",    name: "ซออู้",    xMin: 0.80, xMax: 1.00, emoji: "🎵", speed: 320,
        melody: [N.E4, N.G4, N.A4, N.C5, N.D5, N.E5, N.D5, N.C5, N.A4, N.G4, N.E4, N.G4, N.A4, N.C5, N.A4, N.G4]
      }
    ];

    let activeHoldIntervals = {};
    let noteIndexes = { "inst-ranat": 0, "inst-khong": 0, "inst-taphon": 0, "inst-ching": 0, "inst-saw": 0 };

    // --- Audio Generators --- //

    function playRanatSound(freq) {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(freq * 3.01, now);

      gain.gain.setValueAtTime(0.6, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

      osc.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now); osc2.start(now);
      osc.stop(now + 0.35); osc2.stop(now + 0.35);
    }

    function playKhongSound(freq) {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const overtone = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      overtone.type = 'sine';
      overtone.frequency.setValueAtTime(freq * 2.76, now);

      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);

      osc.connect(gain); overtone.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now); overtone.start(now);
      osc.stop(now + 0.85); overtone.stop(now + 0.85);
    }

    function playTaphonSound(pitch) {
      if (pitch === 0) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(pitch, now);
      osc.frequency.exponentialRampToValueAtTime(35, now + 0.22);

      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.28);
    }

    function playChingSound(type) {
      if (type === 0) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      const isChing = (type === 1);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(isChing ? 880 : 420, now);

      gain.gain.setValueAtTime(0.45, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + (isChing ? 0.95 : 0.12));

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + (isChing ? 0.95 : 0.12));
    }

    function playSawSound(freq) {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.frequency.setValueAtTime(5.5, now);
      lfoGain.gain.setValueAtTime(5, now);
      lfo.connect(osc.frequency);
      lfo.start(now);

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, now);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(700, now);

      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.5);
      lfo.stop(now + 0.5);
    }

    function stepMelody(inst) {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const idx = noteIndexes[inst.id] % inst.melody.length;
      const noteVal = inst.melody[idx];
      noteIndexes[inst.id]++;

      const card = document.getElementById(inst.id);
      card.classList.add("active");
      setTimeout(() => card.classList.remove("active"), 180);

      createFloatingParticle(card, inst.emoji);

      if (inst.id === "inst-ranat") playRanatSound(noteVal);
      else if (inst.id === "inst-khong") playKhongSound(noteVal);
      else if (inst.id === "inst-taphon") playTaphonSound(noteVal);
      else if (inst.id === "inst-ching") playChingSound(noteVal);
      else if (inst.id === "inst-saw") playSawSound(noteVal);
    }

    function createFloatingParticle(targetEl, symbol) {
      const rect = targetEl.getBoundingClientRect();
      const p = document.createElement("div");
      p.className = "note-particle animate-float-note";
      p.innerText = symbol;
      p.style.left = `${rect.left + rect.width / 2 - 15}px`;
      p.style.top = `${rect.top}px`;
      particleLayer.appendChild(p);
      setTimeout(() => p.remove(), 900);
    }

    // --- Tracking Logic --- //

    async function initHandTracking() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      });

      statusDiv.innerHTML = "<span>✅ พร้อมบรรเลงบทเพลงแล้ว!</span>";
      statusDiv.className = "text-xs md:text-sm font-bold bg-emerald-100 text-emerald-700 px-4 py-2 rounded-2xl border-2 border-emerald-300 shadow-sm";
      startWebcam();
    }

    function startWebcam() {
      navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } }).then((stream) => {
        video.srcObject = stream;
        video.addEventListener("loadeddata", renderLoop);
      });
    }

    async function renderLoop() {
      canvasElement.width = video.videoWidth;
      canvasElement.height = video.videoHeight;

      if (lastVideoTime !== video.currentTime && handLandmarker) {
        lastVideoTime = video.currentTime;
        const results = handLandmarker.detectForVideo(video, performance.now());

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        const drawingUtils = new DrawingUtils(canvasCtx);
        let newlyDetectedInZone = new Set();

        if (results.landmarks) {
          results.landmarks.forEach((landmarks) => {
            drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, { color: "#fbbf24", lineWidth: 4 });
            drawingUtils.drawLandmarks(landmarks, { color: "#f43f5e", lineWidth: 2, radius: 5 });

            const indexFinger = landmarks[8];
            const handX = 1 - indexFinger.x;
            const handY = indexFinger.y;

            if (handY > 0.60) {
              const matchedInst = instruments.find(inst => handX >= inst.xMin && handX < inst.xMax);
              if (matchedInst) {
                newlyDetectedInZone.add(matchedInst.id);

                if (!activeHoldIntervals[matchedInst.id]) {
                  stepMelody(matchedInst);
                  
                  activeHoldIntervals[matchedInst.id] = setInterval(() => {
                    stepMelody(matchedInst);
                  }, matchedInst.speed);
                }
              }
            }
          });
        }

        instruments.forEach(inst => {
          if (!newlyDetectedInZone.has(inst.id) && activeHoldIntervals[inst.id]) {
            clearInterval(activeHoldIntervals[inst.id]);
            delete activeHoldIntervals[inst.id];
          }
        });

        canvasCtx.restore();
      }

      requestAnimationFrame(renderLoop);
    }

    initHandTracking();
  </script>
</body>
</html>
