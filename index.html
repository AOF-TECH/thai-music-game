<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สัมผัสเสียง ดนตรีไทยสดใส - สำหรับเด็ก</title>
  <!-- Tailwind CSS สำหรับจัดสไตล์ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font Cute & Friendly -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- MediaPipe Hand Landmarker Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0"></script>
  
  <style>
    body {
      font-family: 'Mali', cursive, sans-serif;
    }

    /* Animation สำหรับความสดใส */
    @keyframes floatNote {
      0% { transform: translateY(0px) scale(0.8) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-70px) scale(1.3) rotate(20deg); opacity: 0; }
    }

    .animate-float-note {
      animation: floatNote 0.8s ease-out forwards;
    }

    .instrument-card {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .instrument-card.active {
      transform: translateY(-10px) scale(1.06);
      box-shadow: 0 15px 30px rgba(255, 180, 0, 0.4);
    }

    /* Custom Scroll & Particle Container */
    .note-particle {
      position: absolute;
      pointer-events: none;
      font-size: 2rem;
      z-index: 50;
    }
  </style>
</head>

<body class="bg-gradient-to-b from-sky-200 via-indigo-100 to-amber-100 text-slate-800 min-h-screen flex flex-col justify-between p-3 md:p-5 select-none overflow-hidden">

  <!-- Header น่ารักสดใส -->
  <header class="flex justify-between items-center bg-white/80 backdrop-blur-md p-3 md:p-4 rounded-3xl border-4 border-amber-300 shadow-lg">
    <div class="flex items-center gap-3">
      <div class="bg-amber-400 text-3xl p-2.5 rounded-2xl shadow-inner animate-bounce">
        🪘
      </div>
      <div>
        <h1 class="text-xl md:text-3xl font-bold text-amber-600 drop-shadow-sm">
          ✨ สัมผัสเสียง ดนตรีไทย ✨
        </h1>
        <p class="text-xs md:text-base text-slate-600 font-semibold">
          ยื่นมือลงด้านล่าง แล้วเอามือค้างไว้ฟังเพลงสนุกๆ ได้เลย! 🎉
        </p>
      </div>
    </div>
    
    <div id="status" class="text-xs md:text-sm font-bold bg-amber-100 text-amber-700 px-4 py-2 rounded-2xl border-2 border-amber-300 shadow-sm flex items-center gap-2">
      <span>⏳ กำลังเตรียมกล้อง...</span>
    </div>
  </header>

  <!-- Video Preview Area -->
  <main class="relative flex-1 my-3 bg-white/60 rounded-3xl border-4 border-sky-300/80 shadow-xl overflow-hidden flex items-center justify-center">
    <video id="webcam" class="absolute inset-0 w-full h-full object-cover -scale-x-100" autoplay playsinline></video>
    <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover -scale-x-100 pointer-events-none"></canvas>

    <!-- Visual Banner Guides -->
    <div class="absolute top-3 bg-amber-400/90 text-slate-900 px-6 py-2 rounded-full border-2 border-white text-xs md:text-base font-bold shadow-lg backdrop-blur-sm flex items-center gap-2 animate-pulse">
      <span>👇 วางมือค้างไว้ที่เครื่องดนตรีด้านล่างเพื่อเล่นเพลง 🎶</span>
    </div>

    <!-- Floating Notes Effect Layer -->
    <div id="particle-layer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
  </main>

  <!-- Instrument Cards (Kid-Friendly Palette) -->
  <footer class="grid grid-cols-5 gap-2 md:gap-4 h-36 md:h-44">
    
    <!-- 1. ระนาดเอก -->
    <div id="inst-ranat" class="instrument-card bg-amber-100 border-4 border-amber-400 rounded-3xl p-2 md:p-3 flex flex-col items-center justify-center text-center shadow-md relative overflow-hidden">
      <div class="text-3xl md:text-5xl mb-1">🪘</div>
      <div class="font-bold text-amber-800 text-xs md:text-lg">ระนาดเอก</div>
      <div class="text-[10px] md:text-xs text-amber-600 font-semibold mt-0.5 bg-amber-200 px-2 py-0.5 rounded-full">ตีรัวๆ 🎶</div>
    </div>

    <!-- 2. ฆ้องวงใหญ่ -->
    <div id="inst-khong" class="instrument-card bg-rose-100 border-4 border-rose-400 rounded-3xl p-2 md:p-3 flex flex-col items-center justify-center text-center shadow-md relative overflow-hidden">
      <div class="text-3xl md:text-5xl mb-1">⭕</div>
      <div class="font-bold text-rose-800 text-xs md:text-lg">ฆ้องวง</div>
      <div class="text-[10px] md:text-xs text-rose-600 font-semibold mt-0.5 bg-rose-200 px-2 py-0.5 rounded-full">ทำนองใส 🔔</div>
    </div>

    <!-- 3. ตะโพน -->
    <div id="inst-taphon" class="instrument-card bg-emerald-100 border-4 border-emerald-400 rounded-3xl p-2 md:p-3 flex flex-col items-center justify-center text-center shadow-md relative overflow-hidden">
      <div class="text-3xl md:text-5xl mb-1">🥁</div>
      <div class="font-bold text-emerald-800 text-xs md:text-lg">ตะโพน</div>
      <div class="text-[10px] md:text-xs text-emerald-600 font-semibold mt-0.5 bg-emerald-200 px-2 py-0.5 rounded-full">จังหวะมันส์ 💥</div>
    </div>

    <!-- 4. ฉิ่ง -->
    <div id="inst-ching" class="instrument-card bg-sky-100 border-4 border-sky-400 rounded-3xl p-2 md:p-3 flex flex-col items-center justify-center text-center shadow-md relative overflow-hidden">
      <div class="text-3xl md:text-5xl mb-1">🔔</div>
      <div class="font-bold text-sky-800 text-xs md:text-lg">ฉิ่ง</div>
      <div class="text-[10px] md:text-xs text-sky-600 font-semibold mt-0.5 bg-sky-200 px-2 py-0.5 rounded-full">ฉิ่ง-ฉับ 🎵</div>
    </div>

    <!-- 5. ซออู้ -->
    <div id="inst-saw" class="instrument-card bg-purple-100 border-4 border-purple-400 rounded-3xl p-2 md:p-3 flex flex-col items-center justify-center text-center shadow-md relative overflow-hidden">
      <div class="text-3xl md:text-5xl mb-1">🎻</div>
      <div class="font-bold text-purple-800 text-xs md:text-lg">ซออู้</div>
      <div class="text-[10px] md:text-xs text-purple-600 font-semibold mt-0.5 bg-purple-200 px-2 py-0.5 rounded-full">เพลงหวาน 🎶</div>
    </div>

  </footer>

  <script type="module">
    import { HandLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

    const video = document.getElementById("webcam");
    const canvasElement = document.getElementById("output_canvas");
    const canvasCtx = canvasElement.getContext("2d");
    const statusDiv = document.getElementById("status");
    const particleLayer = document.getElementById("particle-layer");

    let handLandmarker;
    let lastVideoTime = -1;

    // Web Audio API สำหรับสังเคราะห์เสียงดนตรีไทยสมจริง
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // ข้อมูลเครื่องดนตรีและโหมดการเล่นต่อเนื่องเมื่อเอามือค้าง
    const instruments = [
      { id: "inst-ranat",  name: "ระนาดเอก", xMin: 0.00, xMax: 0.20, emoji: "🪘", notes: [523.25, 587.33, 659.25, 698.46, 783.99] },
      { id: "inst-khong",  name: "ฆ้องวง",   xMin: 0.20, xMax: 0.40, emoji: "🔔", notes: [587.33, 659.25, 783.99, 880.00, 987.77] },
      { id: "inst-taphon", name: "ตะโพน",   xMin: 0.40, xMax: 0.60, emoji: "🥁", notes: [150, 120, 180, 100] },
      { id: "inst-ching",  name: "ฉิ่ง",     xMin: 0.60, xMax: 0.80, emoji: "✨", notes: [880.00, 440.00] },
      { id: "inst-saw",    name: "ซออู้",    xMin: 0.80, xMax: 1.00, emoji: "🎶", notes: [329.63, 392.00, 440.00, 523.25, 587.33] }
    ];

    // ตัวแปรสำหรับคุมระบบเล่นต่อเนื่อง
    let activeHoldIntervals = {};
    let noteIndexes = { "inst-ranat": 0, "inst-khong": 0, "inst-taphon": 0, "inst-ching": 0, "inst-saw": 0 };

    // --- ระบบสังเคราะห์เสียงสมจริง (Realistic Thai Instruments Sound Generator) --- //

    // 1. เสียงระนาดเอก (Woody percussion + Rich Harmonics)
    function playRanatSound(freq) {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);

      // Harmonics เพิ่มความเป็นเสียงไม้ระนาด
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(freq * 3.01, now);

      gain.gain.setValueAtTime(0.6, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

      osc.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc2.start(now);
      osc.stop(now + 0.35);
      osc2.stop(now + 0.35);
    }

    // 2. เสียงฆ้องวง (Metallic Bell Resonance)
    function playKhongSound(freq) {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const overtone = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);

      overtone.type = 'sine';
      overtone.frequency.setValueAtTime(freq * 2.76, now); // Metallic overtone

      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

      osc.connect(gain);
      overtone.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      overtone.start(now);
      osc.stop(now + 0.8);
      overtone.stop(now + 0.8);
    }

    // 3. เสียงกลองตะโพน (Membranophone Drum Synthetic)
    function playTaphonSound(pitch) {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(pitch, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.2); // Pitch drop for drum head

      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.3);
    }

    // 4. เสียงฉิ่ง (Ching Open / Chhab Muted)
    function playChingSound(isChing) {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(isChing ? 880 : 400, now);

      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + (isChing ? 0.9 : 0.12));

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + (isChing ? 0.9 : 0.12));
    }

    // 5. เสียงซออู้ (Bowed String with Vibrato & Filter)
    function playSawSound(freq) {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      // Vibrato LFO (ลูกคอซอ)
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.frequency.setValueAtTime(5.5, now);
      lfoGain.gain.setValueAtTime(6, now);
      lfo.connect(osc.frequency);
      lfo.start(now);

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, now);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(750, now); // ให้เสียงนุ่มแบบซออู้

      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.45);
      lfo.stop(now + 0.45);
    }

    // ฟังก์ชันยิงโน้ตเสียงเฉพาะเครื่อง
    function triggerInstrumentSound(inst) {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const card = document.getElementById(inst.id);
      card.classList.add("active");
      setTimeout(() => card.classList.remove("active"), 200);

      // สร้างเอฟเฟกต์ตัวโน้ตลอย
      createFloatingParticle(card, inst.emoji);

      if (inst.id === "inst-ranat") {
        // ตีรัวระนาด
        const freq = inst.notes[noteIndexes[inst.id] % inst.notes.length];
        playRanatSound(freq);
        noteIndexes[inst.id]++;
      } else if (inst.id === "inst-khong") {
        // ทำนองฆ้องวง
        const freq = inst.notes[noteIndexes[inst.id] % inst.notes.length];
        playKhongSound(freq);
        noteIndexes[inst.id]++;
      } else if (inst.id === "inst-taphon") {
        // จังหวะตะโพน
        const pitch = inst.notes[noteIndexes[inst.id] % inst.notes.length];
        playTaphonSound(pitch);
        noteIndexes[inst.id]++;
      } else if (inst.id === "inst-ching") {
        // สลับ ฉิ่ง / ฉับ
        const isChing = (noteIndexes[inst.id] % 2 === 0);
        playChingSound(isChing);
        noteIndexes[inst.id]++;
      } else if (inst.id === "inst-saw") {
        // สีซอหวานๆ
        const freq = inst.notes[noteIndexes[inst.id] % inst.notes.length];
        playSawSound(freq);
        noteIndexes[inst.id]++;
      }
    }

    // เอฟเฟกต์สร้างตัวโน้ตลอยสำหรับเด็ก
    function createFloatingParticle(targetEl, symbol) {
      const rect = targetEl.getBoundingClientRect();
      const p = document.createElement("div");
      p.className = "note-particle animate-float-note";
      p.innerText = symbol;
      p.style.left = `${rect.left + rect.width / 2 - 15}px`;
      p.style.top = `${rect.top}px`;
      particleLayer.appendChild(p);
      setTimeout(() => p.remove(), 800);
    }

    // --- ระบบติดตามมือ MediaPipe Hand Landmarker --- //

    async function initHandTracking() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      });

      statusDiv.innerHTML = "<span>✅ ระบบพร้อมเล่นแล้ว!</span>";
      statusDiv.className = "text-xs md:text-sm font-bold bg-emerald-100 text-emerald-700 px-4 py-2 rounded-2xl border-2 border-emerald-300 shadow-sm";
      startWebcam();
    }

    function startWebcam() {
      navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } }).then((stream) => {
        video.srcObject = stream;
        video.addEventListener("loadeddata", renderLoop);
      });
    }

    let currentHeldInstruments = new Set();

    async function renderLoop() {
      canvasElement.width = video.videoWidth;
      canvasElement.height = video.videoHeight;

      if (lastVideoTime !== video.currentTime && handLandmarker) {
        lastVideoTime = video.currentTime;
        const results = handLandmarker.detectForVideo(video, performance.now());

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        const drawingUtils = new DrawingUtils(canvasCtx);
        let newlyDetectedInZone = new Set();

        if (results.landmarks) {
          results.landmarks.forEach((landmarks) => {
            // วาดเส้นมือโทนสีสดใส
            drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, { color: "#fbbf24", lineWidth: 4 });
            drawingUtils.drawLandmarks(landmarks, { color: "#f43f5e", lineWidth: 2, radius: 5 });

            // ตรวจสอบตำแหน่งปลาย นิ้วชี้ (Landmark #8) และ นิ้วกลาง (Landmark #12)
            const indexFinger = landmarks[8];
            const handX = 1 - indexFinger.x; // Mirror X
            const handY = indexFinger.y;

            // ตรวจสอบว่ามือยื่นลงมาบริเวณเครื่องดนตรีด้านล่าง (Y > 0.60)
            if (handY > 0.60) {
              const matchedInst = instruments.find(inst => handX >= inst.xMin && handX < inst.xMax);
              if (matchedInst) {
                newlyDetectedInZone.add(matchedInst.id);

                // หากเพิ่งยื่นมือเข้ามาใหม่ -> เริ่มเล่นเสียงและสั่งวนลูป Continuous Loop
                if (!activeHoldIntervals[matchedInst.id]) {
                  triggerInstrumentSound(matchedInst);
                  
                  // ค้างมือไว้ = เล่นเพลงวนลูปต่อเนื่อง
                  const intervalTime = matchedInst.id === "inst-ranat" ? 140 : 280;
                  activeHoldIntervals[matchedInst.id] = setInterval(() => {
                    triggerInstrumentSound(matchedInst);
                  }, intervalTime);
                }
              }
            }
          });
        }

        // ล้าง Loop เครื่องดนตรีที่เอามือออกไปแล้ว
        instruments.forEach(inst => {
          if (!newlyDetectedInZone.has(inst.id) && activeHoldIntervals[inst.id]) {
            clearInterval(activeHoldIntervals[inst.id]);
            delete activeHoldIntervals[inst.id];
          }
        });

        canvasCtx.restore();
      }

      requestAnimationFrame(renderLoop);
    }

    // เริ่มการทำงานระบบ
    initHandTracking();
  </script>
</body>
</html>
